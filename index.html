<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Valentine 💘</title>

  <style>
    /* ===== GENERAL PAGE SETUP ===== */
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      height: 100vh;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    /* ===== MAIN CARD ===== */
    .container {
      background: white;
      width: 340px;
      padding: 35px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      position: relative;
      z-index: 2;
    }

    h1 {
      margin-bottom: 25px;
    }

    /* ===== BUTTONS ===== */
    button {
      font-size: 18px;
      padding: 12px 24px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      position: absolute;
    }

    #yes {
      background-color: #ff4d6d;
      color: white;
      left: 50%;
      transform: translateX(-120%);
    }

    #no {
      background-color: #adb5bd;
      color: white;
      left: 50%;
      transform: translateX(20%);
    }

    /* ===== VISIBILITY CONTROL ===== */
    .hidden {
      display: none;
    }

    /* ===== FINAL IMAGE FADE-IN ===== */
    img {
      width: 100%;
      border-radius: 15px;
      margin-top: 15px;
      opacity: 0;
      animation: fadeIn 2s ease forwards;
    }

    @keyframes fadeIn {
      to { opacity: 1; }
    }

    .final-message {
      margin-top: 15px;
      font-size: 18px;
      opacity: 0;
      animation: fadeIn 3s ease forwards;
    }

    /* ===== SEND KISS ===== */
    #kiss-btn {
      margin-top: 20px;
      font-size: 18px;
      padding: 10px 20px;
      border-radius: 12px;
      border: none;
      background-color: #ff4d6d;
      color: white;
      cursor: pointer;
      position: static;
    }

    /* ===== LOADING STATE ===== */
    .sending-text, .sent-text {
      margin-top: 15px;
      font-size: 18px;
    }

    .loader {
      margin: 20px auto;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      border: 6px solid #ffd6dc;
      border-top: 6px solid #ff4d6d;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .big-kiss {
      font-size: 60px;
      margin-top: 20px;
      animation: pop 0.6s ease;
    }

    @keyframes pop {
      0% { transform: scale(0.5); }
      100% { transform: scale(1); }
    }

    /* ===== FLOATING HEARTS ===== */
    .heart {
      position: fixed;
      bottom: -20px;
      font-size: 20px;
      animation: floatUp 5s linear forwards;
      z-index: 1;
    }

    @keyframes floatUp {
      from {
        transform: translateY(0);
        opacity: 1;
      }
      to {
        transform: translateY(-100vh);
        opacity: 0;
      }
    }
  </style>
</head>

<body>

  <div class="container">
    <h1 id="question">Will you be my Valentine? 💕</h1>

    <button id="yes">Yes</button>
    <button id="no">No</button>

    <!-- FINAL SCENE -->
    <div id="final" class="hidden">
      <img src="us.JPEG" alt="Us 💖">

      <div class="final-message">
        Happy Valentine’s Day, my handsome boy 💘  
        I love you so much more than words can explain, and I hope you know I’m so grateful for you every single day.
      </div>

      <button id="kiss-btn">Send Kiss 💋</button>

      <div id="sending" class="hidden">
        <div class="sending-text">Sending kiss to you… 💕</div>
        <div class="loader"></div>
      </div>

      <div id="kiss-complete" class="hidden">
        <div class="big-kiss">💋</div>
        <div class="sent-text">Kiss delivered 💖</div>
      </div>
    </div>

    <audio id="music" src="song.m4a"></audio>
  </div>

  <script>
    /* ===== ELEMENT REFERENCES ===== */
    const yesButton = document.getElementById("yes");
    const noButton = document.getElementById("no");
    const question = document.getElementById("question");
    const final = document.getElementById("final");
    const music = document.getElementById("music");
    const container = document.querySelector(".container");

    const kissBtn = document.getElementById("kiss-btn");
    const sending = document.getElementById("sending");
    const kissComplete = document.getElementById("kiss-complete");

    let yesClicks = 0;

    /* ===== NO BUTTON RUNS AWAY ===== */
    function moveButton() {
      const rect = container.getBoundingClientRect();
      const maxX = rect.width - noButton.offsetWidth;
      const maxY = rect.height - noButton.offsetHeight;

      noButton.style.left = Math.random() * maxX + "px";
      noButton.style.top = Math.random() * maxY + "px";
    }

    noButton.addEventListener("mouseenter", moveButton);
    noButton.addEventListener("touchstart", moveButton);

    /* ===== YES BUTTON LOGIC ===== */
    yesButton.addEventListener("click", () => {
      yesClicks++;

      if (yesClicks === 1) {
        question.textContent = "Are you sure? 🥺";
      } else {
        question.style.display = "none";
        yesButton.style.display = "none";
        noButton.style.display = "none";
        final.classList.remove("hidden");
        music.play();
        startHearts();
      }
    });

    /* ===== FLOATING HEARTS ===== */
    function startHearts() {
      setInterval(() => {
        const heart = document.createElement("div");
        heart.className = "heart";
        heart.textContent = "💖";
        heart.style.left = Math.random() * 100 + "vw";
        heart.style.fontSize = Math.random() * 20 + 15 + "px";
        document.body.appendChild(heart);

        setTimeout(() => heart.remove(), 5000);
      }, 300);
    }

    /* ===== SEND KISS SEQUENCE ===== */
    kissBtn.addEventListener("click", () => {
      kissBtn.style.display = "none";
      sending.classList.remove("hidden");

      setTimeout(() => {
        sending.classList.add("hidden");
        kissComplete.classList.remove("hidden");
        burstHearts();
      }, 2500);
    });

    /* ===== HEART BURST ===== */
    function burstHearts() {
      for (let i = 0; i < 20; i++) {
        const heart = document.createElement("div");
        heart.className = "heart";
        heart.textContent = "💋";
        heart.style.left = Math.random() * 100 + "vw";
        heart.style.fontSize = Math.random() * 25 + 20 + "px";
        document.body.appendChild(heart);

        setTimeout(() => heart.remove(), 4000);
      }
    }
  </script>

</body>
</html>
